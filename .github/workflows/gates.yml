# The four definition-of-done gates from TASKS.md, run on every PR and on main.
#
# These are exactly the checks a contributor runs locally; nothing here is
# CI-only, so a green run means the same thing as a clean working copy. Note
# `python -m mypy`, never bare `mypy` — the TASKS.md gate notes explain why.
name: gates

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result, not just the first to fail.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests tools

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest -q

      # `spc-demo demo` rewrites DEMO.md in the repo root. The demo is
      # deterministic, so a clean tree afterwards is the gate: any diff means
      # the committed artifacts no longer match what the pipeline produces.
      - name: deterministic demo
        run: |
          spc-demo demo
          git diff --exit-code

      # `runs/` is gitignored; this catches generated output escaping it.
      - name: no run output committed
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "the demo left untracked files behind:"
            echo "$untracked"
            exit 1
          fi

  typecheck-with-openrouter-extra:
    # The `openai` import is typed differently depending on whether the
    # optional extra is installed. The gates job covers it absent; this covers
    # it present, so the mypy configuration cannot regress in either direction.
    name: mypy (openrouter extra installed)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the openrouter extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,openrouter]"

      - name: mypy
        run: python -m mypy
